x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
  image: lakehouse-airflow:2.10.5
  profiles: ["batch"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-change-me-airflow-db}@postgres-airflow:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-airflow-secret}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    PIPELINE_ENV: ${PIPELINE_ENV:-local}
    PIPELINE_RUN_DIRECTORY: /data/pipeline-runs
    PIPELINE_CONFIG_PATH: /opt/project/pipelines/batch/config/default.yml
    # ML_CONFIG_PATH: /opt/project/ml/repurchase/configs/default.yml
    MYSQL_ECOMMERCE_READER_URL: mysql+pymysql://${MYSQL_ECOMMERCE_READER_USER:-ecommerce_de_reader}:${MYSQL_ECOMMERCE_READER_PASSWORD:-change-me-ecommerce-reader}@mysql-ecommerce:3306/${MYSQL_ECOMMERCE_DATABASE:-ecommerce}
    MYSQL_ANALYTICS_PUBLISH_URL: mysql+pymysql://${MYSQL_ANALYTICS_USER:-analytics_publisher}:${MYSQL_ANALYTICS_PASSWORD:-change-me-analytics}@mysql-analytics:3306/${MYSQL_ANALYTICS_DATABASE:-analytics}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password}
    SPARK_MASTER_URL: spark://spark-master:7077
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - pipeline-run-data:/data/pipeline-runs
  networks: ["lakehouse-network"]
  depends_on:
    postgres-airflow:
      condition: service_healthy

x-superset-common: &superset-common
  build:
    context: .
    dockerfile: infrastructure/docker/superset/Dockerfile
  image: lakehouse-superset:4.1.2
  profiles: ["bi"]
  environment: &superset-environment
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset-secret}
    SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-change-me-superset-db}@postgres-superset:5432/${SUPERSET_DB_NAME:-superset}
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  volumes:
    - ./infrastructure/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - superset-home:/app/superset_home
  networks: ["lakehouse-network"]

services:
  mysql-ecommerce:
    image: mysql:8.4.5
    profiles: ["core"]
    environment:
      MYSQL_DATABASE: ${MYSQL_ECOMMERCE_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_ECOMMERCE_USER:-ecommerce_app}
      MYSQL_PASSWORD: ${MYSQL_ECOMMERCE_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ECOMMERCE_ROOT_PASSWORD:-password}
      MYSQL_ECOMMERCE_READER_USER: ${MYSQL_ECOMMERCE_READER_USER:-ecommerce_de_reader}
      MYSQL_ECOMMERCE_READER_PASSWORD: ${MYSQL_ECOMMERCE_READER_PASSWORD:-password}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_ECOMMERCE_PORT:-3306}:3306"
    volumes:
      - mysql-ecommerce-data:/var/lib/mysql
      - ./infrastructure/mysql-ecommerce/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --connect-timeout=2 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  ecommerce-api:
    build:
      context: .
      dockerfile: services/ecommerce-api/Dockerfile
    image: ecommerce-api:0.1.0
    profiles: ["core"]
    environment:
      API_DATABASE_URL: mysql+pymysql://${MYSQL_ECOMMERCE_USER:-ecommerce_app}:${MYSQL_ECOMMERCE_PASSWORD:-change-me-ecommerce}@mysql-ecommerce:3306/${MYSQL_ECOMMERCE_DATABASE:-ecommerce}
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-with-at-least-32-random-characters}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      API_ENABLE_DOCS: ${API_ENABLE_DOCS:-true}
      API_ACCESS_TOKEN_TTL_MINUTES: ${API_ACCESS_TOKEN_TTL_MINUTES:-720}
      API_AUTH_COOKIE_NAME: ${API_AUTH_COOKIE_NAME:-web_access}
      API_CSRF_COOKIE_NAME: ${API_CSRF_COOKIE_NAME:-web_csrf}
      API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
      API_COOKIE_SAMESITE: ${API_COOKIE_SAMESITE:-lax}
      API_COOKIE_DOMAIN: ${API_COOKIE_DOMAIN:-}
      API_INTERNAL_SECRET: ${API_INTERNAL_SECRET:-change-me-internal-secret}
      API_DEMO_MODE: ${API_DEMO_MODE:-true}
      API_BOOTSTRAP_ADMIN_EMAIL: ${API_BOOTSTRAP_ADMIN_EMAIL:-admin@web.local}
      API_BOOTSTRAP_ADMIN_PASSWORD: ${API_BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
      API_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${API_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
      API_CURRENCY_CODE: ${API_CURRENCY_CODE:-VND}
      API_SHIPPING_FLAT_FEE_VND: ${API_SHIPPING_FLAT_FEE_VND:-30000}
      API_FREE_SHIPPING_THRESHOLD_VND: ${API_FREE_SHIPPING_THRESHOLD_VND:-500000}
      API_CART_ITEM_MAX_QUANTITY: ${API_CART_ITEM_MAX_QUANTITY:-20}
      API_CATALOG_PAGE_SIZE: ${API_CATALOG_PAGE_SIZE:-12}
      API_ORDER_PAGE_SIZE: ${API_ORDER_PAGE_SIZE:-10}
      API_CHECKOUT_MAX_RETRIES: ${API_CHECKOUT_MAX_RETRIES:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql-ecommerce:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  storefront:
    build:
      context: ./apps/storefront
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-web_csrf}
    image: storefront:0.1.0
    profiles: ["core"]
    ports:
      - "${STOREFRONT_PORT:-3000}:3000"
    depends_on:
      ecommerce-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: ["lakehouse-network"]

  generator:
    build:
      context: .
      dockerfile: generator/Dockerfile
    image: data-generator:0.1.0
    profiles: ["tools"]
    environment:
      ECOMMERCE_API_URL: http://ecommerce-api:8000
    volumes:
      - ./data/generator:/data/generator
    networks: ["lakehouse-network"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["batch"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["batch"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb --ignore-existing local/$${MINIO_LAKEHOUSE_BUCKET};
        mc mb --ignore-existing local/$${MINIO_ML_BUCKET};
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
      # MINIO_ML_BUCKET: ${MINIO_ML_BUCKET:-ml-artifacts}
    depends_on:
      minio:
        condition: service_healthy
    networks: ["lakehouse-network"]

  spark-master:
    image: apache/spark:3.5.5-python3
    profiles: ["batch"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "7077:7077"
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"
    volumes:
      - spark-work:/opt/spark/work-dir
    networks: ["lakehouse-network"]

  spark-worker:
    image: apache/spark:3.5.5-python3
    profiles: ["batch"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "${SPARK_WORKER_UI_PORT:-8083}:8081"
    volumes:
      - spark-work:/opt/spark/work-dir
    depends_on:
      - spark-master
    networks: ["lakehouse-network"]

  postgres-airflow:
    image: postgres:16.8
    profiles: ["batch"]
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-password}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username $${AIRFLOW_ADMIN_USER}
        --password $${AIRFLOW_ADMIN_PASSWORD}
        --firstname Web
        --lastname Admin
        --role Admin
        --email admin@example.local || true)
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  mysql-analytics:
    image: mysql:8.4.5
    profiles: ["bi"]
    environment:
      MYSQL_DATABASE: ${MYSQL_ANALYTICS_DATABASE:-analytics}
      MYSQL_USER: ${MYSQL_ANALYTICS_USER:-analytics_publisher}
      MYSQL_PASSWORD: ${MYSQL_ANALYTICS_PASSWORD:-change-me-analytics}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ANALYTICS_ROOT_PASSWORD:-change-me-analytics-root}
      MYSQL_ANALYTICS_READER_USER: ${MYSQL_ANALYTICS_READER_USER:-analytics_reader}
      MYSQL_ANALYTICS_READER_PASSWORD: ${MYSQL_ANALYTICS_READER_PASSWORD:-change-me-analytics-reader}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_ANALYTICS_PORT:-3307}:3306"
    volumes:
      - mysql-analytics-data:/var/lib/mysql
      - ./infrastructure/mysql-analytics/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --connect-timeout=2 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  postgres-superset:
    image: postgres:16.8
    profiles: ["bi"]
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-change-me-superset-db}
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
    volumes:
      - postgres-superset-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  superset-init:
    <<: *superset-common
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin
        --username $${SUPERSET_ADMIN_USER}
        --password $${SUPERSET_ADMIN_PASSWORD}
        --firstname Web
        --lastname Admin
        --email admin@example.local || true) &&
        superset init
    environment:
      <<: *superset-environment
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me-superset}
    depends_on:
      postgres-superset:
        condition: service_healthy

  superset:
    <<: *superset-common
    command: ["gunicorn", "--bind", "0.0.0.0:8088", "--workers", "2", "--timeout", "120", "superset.app:create_app()"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      mysql-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 20

networks:
  lakehouse-network:
    name: lakehouse-network

volumes:
  mysql-ecommerce-data:
  mysql-analytics-data:
  minio-data:
  spark-work:
  postgres-airflow-data:
  postgres-superset-data:
  pipeline-run-data:
  superset-home:
