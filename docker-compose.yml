x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
  image: lakehouse-airflow:2.10.5
  profiles: ["batch"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-password}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-airflow-secret}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    PIPELINE_ENV: ${PIPELINE_ENV:-local}
    PIPELINE_RUN_DIRECTORY: /data/pipeline-runs
    PIPELINE_CONFIG_PATH: /opt/project/pipelines/config/default.yml
    PYTHONPATH: /opt/project/pipelines/src
    MYSQL_ECOMMERCE_READER_URL: mysql+pymysql://${MYSQL_USER:-ecommerce_app}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-ecommerce}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password}
    MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-lakehouse}
    POLARIS_CATALOG_URI: http://polaris:8181/api/catalog
    POLARIS_CATALOG_NAME: ${POLARIS_CATALOG_NAME:-lakehouse}
    POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
    SPARK_MASTER_URL: spark://spark-master:7077
    TRINO_URL: http://trino:8080
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./pipelines:/opt/project/pipelines:ro
    - airflow-logs:/opt/airflow/logs
    - pipeline-run-data:/data/pipeline-runs
    - polaris-client-credentials:/run/polaris:ro
  networks: ["lakehouse-network"]
  depends_on:
    postgres:
      condition: service_healthy

x-superset-common: &superset-common
  build:
    context: .
    dockerfile: infrastructure/docker/superset/Dockerfile
  image: lakehouse-superset:4.1.2
  profiles: ["bi"]
  environment: &superset-environment
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset-secret}
    SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-password}@postgres:5432/${SUPERSET_DB_NAME:-superset}
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  volumes:
    - ./infrastructure/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - ./infrastructure/superset/datasources.yml:/app/config/datasources.yml:ro
    - superset-home:/app/superset_home
  networks: ["lakehouse-network"]

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: infrastructure/spark/Dockerfile
    args:
      ICEBERG_VERSION: ${ICEBERG_VERSION:-1.10.1}
  image: lakehouse-spark:3.5.9-iceberg-${ICEBERG_VERSION:-1.10.1}
  profiles: ["batch"]
  environment:
    POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
  networks: ["lakehouse-network"]

x-polaris-database-environment: &polaris-database-environment
  POLARIS_PERSISTENCE_TYPE: relational-jdbc
  POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POLARIS_DB_NAME:-polaris}
  QUARKUS_DATASOURCE_USERNAME: ${POLARIS_DB_USER:-polaris}
  QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_DB_PASSWORD:-password}

services:
  mysql:
    image: mysql:8.4.5
    profiles: ["core"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -P 3306 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --connect-timeout=2 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  ecommerce-api:
    build:
      context: .
      dockerfile: services/ecommerce-api/Dockerfile
    image: ecommerce-api:0.1.0
    profiles: ["core"]
    environment:
      API_DATABASE_URL: mysql+pymysql://${MYSQL_USER:-ecommerce_app}:${MYSQL_PASSWORD:-password}@mysql:3306/${MYSQL_DATABASE:-ecommerce}
      API_SECRET_KEY: ${API_SECRET_KEY:-change-me-with-at-least-32-random-characters}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000}
      API_BOOTSTRAP_ADMIN_EMAIL: ${API_BOOTSTRAP_ADMIN_EMAIL:-admin@web.local}
      API_BOOTSTRAP_ADMIN_PASSWORD: ${API_BOOTSTRAP_ADMIN_PASSWORD:-Admin@12345}
      API_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${API_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Admin}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  storefront:
    build:
      context: ./apps/storefront
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CSRF_COOKIE_NAME: ${NEXT_PUBLIC_CSRF_COOKIE_NAME:-web_csrf}
    image: storefront:0.1.0
    profiles: ["core"]
    ports:
      - "${STOREFRONT_PORT:-3000}:3000"
    depends_on:
      ecommerce-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: ["lakehouse-network"]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["batch"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_LAKEHOUSE_BUCKET} &&
        mc anonymous set none local/$${MINIO_LAKEHOUSE_BUCKET} &&
        mc ls local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-web-lakehouse}
    depends_on:
      minio:
        condition: service_healthy
    networks: ["lakehouse-network"]

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.2.3
    profiles: ["batch"]
    command: ["--config", "/fluent-bit/etc/fluent-bit.yaml"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MINIO_LAKEHOUSE_BUCKET: ${MINIO_LAKEHOUSE_BUCKET:-web-lakehouse}
      FLUENT_BIT_UPLOAD_TIMEOUT: ${FLUENT_BIT_UPLOAD_TIMEOUT:-15m}
      FLUENT_BIT_READ_FROM_HEAD: ${FLUENT_BIT_READ_FROM_HEAD:-false}
    volumes:
      - ./infrastructure/fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - fluent-bit-state:/var/lib/fluent-bit/state
      - fluent-bit-buffer:/var/lib/fluent-bit/storage
      - fluent-bit-s3-buffer:/var/lib/fluent-bit/s3
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: ["lakehouse-network"]

  postgres:
    image: postgres:16.8
    profiles: ["batch", "bi"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: ["lakehouse-network"]

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.6.0
    profiles: ["batch"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set +e
        output="$$(java -jar /deployments/polaris-admin-tool.jar bootstrap \
          --realm="$${POLARIS_REALM}" \
          --credential="$${POLARIS_REALM},$${POLARIS_ROOT_CLIENT_ID},$${POLARIS_ROOT_CLIENT_SECRET}" 2>&1)"
        status=$$?
        if [ "$$status" -eq 0 ]; then
          printf '%s\n' "$$output"
          exit 0
        fi
        if printf '%s' "$$output" | grep -q 'already been bootstrapped'; then
          echo "Realm already exists; bootstrap is complete."
          exit 0
        fi
        printf '%s\n' "$$output" >&2
        exit "$$status"
    environment:
      <<: *polaris-database-environment
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-password}
    depends_on:
      postgres:
        condition: service_healthy
    networks: ["lakehouse-network"]

  polaris:
    image: apache/polaris:1.6.0
    profiles: ["batch"]
    environment:
      <<: *polaris-database-environment
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: 5
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: 100
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: 5000
      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_REALM:-POLARIS}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password}
      QUARKUS_OTEL_SDK_DISABLED: "true"
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: ${POLARIS_CONSOLE_ORIGIN:-http://localhost:8183}
      QUARKUS_HTTP_CORS_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS
      QUARKUS_HTTP_CORS_HEADERS: Content-Type,Authorization,Polaris-Realm,X-Request-ID
    ports:
      - "${POLARIS_API_PORT:-8181}:8181"
      - "${POLARIS_MANAGEMENT_PORT:-8182}:8182"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      polaris-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    networks: ["lakehouse-network"]

  polaris-init:
    image: alpine/curl:8.21.0
    profiles: ["batch"]
    environment:
      POLARIS_URL: http://polaris:8181
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      POLARIS_CATALOG: ${POLARIS_CATALOG_NAME:-lakehouse}
      POLARIS_ROOT_CLIENT_ID: ${POLARIS_ROOT_CLIENT_ID:-root}
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET:-password}
      POLARIS_WAREHOUSE_LOCATION: s3://${MINIO_LAKEHOUSE_BUCKET:-lakehouse}/warehouse
      POLARIS_ALLOWED_LOCATION: s3://${MINIO_LAKEHOUSE_BUCKET:-lakehouse}/
      POLARIS_S3_ENDPOINT: http://minio:9000
      POLARIS_S3_ENDPOINT_INTERNAL: http://minio:9000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    volumes:
      - ./infrastructure/polaris:/bootstrap:ro
      - polaris-client-credentials:/run/polaris
    depends_on:
      polaris:
        condition: service_healthy
    networks: ["lakehouse-network"]

  polaris-console:
    build:
      context: https://github.com/apache/polaris-tools.git#e5fea020aedcb1834f306d9a13de7fccbfff1943:console
      dockerfile: docker/Dockerfile
    image: polaris-console:1.4.0-e5fea020
    profiles: ["batch"]
    environment:
      VITE_POLARIS_API_URL: ${POLARIS_PUBLIC_API_URL:-http://localhost:8181}
      VITE_OAUTH_TOKEN_URL: ${POLARIS_PUBLIC_API_URL:-http://localhost:8181}/api/catalog/v1/oauth/tokens
      VITE_POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      VITE_POLARIS_PRINCIPAL_SCOPE: PRINCIPAL_ROLE:ALL
      VITE_POLARIS_REALM_HEADER_NAME: Polaris-Realm
    ports:
      - "${POLARIS_CONSOLE_PORT:-8183}:8080"
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: ["lakehouse-network"]

  spark-master:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8082}:8080"
    volumes:
      - spark-work:/opt/spark/work-dir

  spark-worker:
    <<: *spark-common
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
    ports:
      - "${SPARK_WORKER_UI_PORT:-8083}:8081"
    volumes:
      - spark-work:/opt/spark/work-dir
    depends_on:
      spark-master:
        condition: service_started

  spark-client:
    <<: *spark-common
    profiles: ["lakehouse-tools"]
    entrypoint: ["/opt/project/spark/with-polaris-credentials.sh"]
    command:
      - /opt/spark/bin/spark-sql
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.host=spark-client
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - -f
      - /opt/project/spark/sql/smoke.sql
    volumes:
      - polaris-client-credentials:/run/polaris:ro
    depends_on:
      polaris-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started

  airflow-init:
    <<: *airflow-common
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username $${AIRFLOW_ADMIN_USER}
        --password $${AIRFLOW_ADMIN_PASSWORD}
        --firstname Web
        --lastname Admin
        --role Admin
        --email admin@example.local || true) &&
        (airflow connections delete spark_default || true) &&
        airflow connections add spark_default
        --conn-host spark://spark-master:7077
        --conn-type spark
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-password}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $${HOSTNAME}"]
      interval: 20s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  trino:
    image: trinodb/trino:483
    profiles: ["bi"]
    entrypoint: ["/bin/sh", "/opt/trino/start.sh"]
    environment:
      POLARIS_CREDENTIAL_FILE: /run/polaris/clients.env
      POLARIS_REALM: ${POLARIS_REALM:-POLARIS}
      TRINO_POLARIS_ROLE: ${TRINO_POLARIS_ROLE:-reader}
    ports:
      - "${TRINO_PORT:-8084}:8080"
    volumes:
      - ./infrastructure/trino/start.sh:/opt/trino/start.sh:ro
      - ./infrastructure/trino/config.properties:/etc/trino/config.properties:ro
      - ./infrastructure/trino/catalog:/etc/trino/catalog:ro
      - polaris-client-credentials:/run/polaris:ro
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: ["lakehouse-network"]

  superset-init:
    <<: *superset-common
    command:
      - /bin/sh
      - -c
      - >-
        superset db upgrade &&
        (superset fab create-admin
        --username $${SUPERSET_ADMIN_USER}
        --password $${SUPERSET_ADMIN_PASSWORD}
        --firstname Web
        --lastname Admin
        --role Admin
        --email admin@example.local || true) &&
        superset init &&
        superset import_datasources -p /app/config/datasources.yml
    environment:
      <<: *superset-environment
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy
      trino:
        condition: service_healthy

  superset:
    <<: *superset-common
    command: ["gunicorn", "--bind", "0.0.0.0:8088", "--workers", "2", "--timeout", "120", "superset.app:create_app()"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 20

networks:
  lakehouse-network:
    name: lakehouse-network

volumes:
  mysql-data:
  minio-data:
  fluent-bit-state:
  fluent-bit-buffer:
  fluent-bit-s3-buffer:
  spark-work:
  postgres-data:
  polaris-client-credentials:
  airflow-logs:
  pipeline-run-data:
  superset-home:
