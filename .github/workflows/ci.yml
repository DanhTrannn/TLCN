name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.13"
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22.18.0"

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate Docker Compose
        run: docker compose --profile core --profile tools --profile batch --profile bi --profile lakehouse-tools config --quiet

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run Ecommerce API tests
        run: >-
          uv run --locked --package ecommerce-api --extra dev --
          pytest services/ecommerce-api/tests

      - name: Run data-generator tests
        run: >-
          uv run --locked --package data-generator --extra dev --
          pytest generator/tests

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CSRF_COOKIE_NAME: web_csrf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check storefront
        run: npm run typecheck

      - name: Build storefront
        run: npm run build
