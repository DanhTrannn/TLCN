name: CI

on:
  push:
    branches: [dev, main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.13"
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22.18.0"

jobs:
  repository-validation:
    name: Repository validation & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Validate Docker Compose (all active profiles)
        run: >-
          docker compose --profile core --profile batch --profile streaming --profile lakehouse-tools
          config --quiet

      - name: Verify Airflow DAG Python compilation
        run: python3 -m compileall -q airflow/dags/

      - name: Lint Python codebase with ruff
        run: uvx ruff check .

  python-tests:
    name: Python tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ecommerce API
            package: ecommerce-api
            command: >-
              uv run --locked --package ecommerce-api --extra dev --
              pytest services/ecommerce-api/tests
          - name: Data Generator
            package: data-generator
            command: >-
              uv run --locked --package data-generator --extra dev --
              pytest generator/tests
          - name: Batch Pipeline & DAGs
            package: batch-pipeline
            command: >-
              PYTHONPATH=pipelines/src uv run --locked --package batch-pipeline --extra dev --
              pytest pipelines/tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Java for Spark tests
        if: matrix.package == 'batch-pipeline'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CSRF_COOKIE_NAME: web_csrf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check storefront
        run: npm run typecheck

      - name: Build storefront
        run: npm run build

  docker-smoke-build:
    name: Dockerfile build verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ecommerce API image (Dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ecommerce-api/Dockerfile
          push: false
          tags: ecommerce-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Storefront image (Dry run)
        uses: docker/build-push-action@v6
        with:
          context: apps/storefront
          file: apps/storefront/Dockerfile
          push: false
          tags: storefront:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke-test:
    name: Docker Compose core services smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Start Core Database Services
        run: docker compose up -d mysql postgres

      - name: Wait for MySQL OLTP and PostgreSQL readiness
        run: |
          for i in {1..30}; do
            if docker compose exec -T mysql mysqladmin ping -u root -ppassword --silent && docker compose exec -T postgres pg_isready -U postgres; then
              echo "Core database services are healthy"
              break
            fi
            echo "Waiting for database services..."
            sleep 2
          done

      - name: Teardown
        if: always()
        run: docker compose down -v

