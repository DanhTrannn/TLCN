name: CI

on:
  push:
    branches: [dev, main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11.13"
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22.18.0"

jobs:
  repository-validation:
    name: Repository validation & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Validate Docker Compose (all active profiles)
        run: >-
          docker compose --profile core --profile batch --profile streaming --profile lakehouse-tools
          config --quiet

      - name: Verify Airflow DAG Python compilation
        run: python3 -m compileall -q airflow/dags/

      - name: Lint Python codebase with ruff
        run: uvx ruff check .

  python-tests:
    name: Python tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ecommerce API
            package: ecommerce-api
            command: >-
              uv run --locked --package ecommerce-api --extra dev --
              pytest services/ecommerce-api/tests
          - name: Data Generator
            package: data-generator
            command: >-
              uv run --locked --package data-generator --extra dev --
              pytest generator/tests
          - name: Batch Pipeline & DAGs
            package: batch-pipeline
            command: >-
              PYTHONPATH=pipelines/src uv run --locked --package batch-pipeline --extra dev --
              pytest pipelines/tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Java for Spark tests
        if: matrix.package == 'batch-pipeline'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run ${{ matrix.name }} tests
        run: ${{ matrix.command }}

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CSRF_COOKIE_NAME: web_csrf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint storefront
        run: npm run lint

      - name: Run storefront unit tests
        run: npm test

      - name: Type-check storefront
        run: npm run typecheck

      - name: Build storefront
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run storefront browser tests
        run: npm run test:e2e

  docker-smoke-build:
    name: Dockerfile build verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ecommerce API image (Dry run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ecommerce-api/Dockerfile
          push: false
          tags: ecommerce-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Storefront image (Dry run)
        uses: docker/build-push-action@v6
        with:
          context: apps/storefront
          file: apps/storefront/Dockerfile
          push: false
          tags: storefront:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke-test:
    name: Docker Compose core services smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Start Core Database Services
        run: docker compose up -d mysql postgres

      - name: Wait for MySQL OLTP and PostgreSQL readiness
        run: |
          ready=0
          for i in {1..30}; do
            if docker compose exec -T mysql mysql --protocol=tcp -h 127.0.0.1 -u ecommerce_app -ppassword ecommerce -Nse "SELECT 1" \
              && docker compose exec -T postgres pg_isready -U postgres; then
              echo "Core database services are healthy"
              ready=1
              break
            fi
            echo "Waiting for database services..."
            sleep 2
          done
          test "$ready" -eq 1

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify data-bearing Alembic migrations on real MySQL 8.4
        env:
          API_DATABASE_URL: mysql+pymysql://ecommerce_app:password@127.0.0.1:3306/ecommerce
          API_SECRET_KEY: ci-test-secret-key-32-characters-minimum
        run: |
          set -o pipefail
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini upgrade 0018
          docker compose exec -T mysql mysql -u ecommerce_app -ppassword ecommerce -e \
            "INSERT INTO customers (public_id, display_name, status, data_origin) \
             VALUES (UUID_TO_BIN(UUID()), 'Migration Customer', 'active', 'manual'); \
             SET @customer_id = LAST_INSERT_ID(); \
             INSERT INTO orders \
               (order_number, cart_id, customer_id, checkout_idempotency_key, status, payment_method, \
                currency_code, subtotal_vnd, shipping_fee_vnd, total_vnd, receiver_name, receiver_phone, \
                shipping_address_text, data_origin, confirmed_at, channel) \
             VALUES \
               ('ORD-MIGRATION-CHECK', NULL, @customer_id, 'migration-checkout', 'shipping', 'cod', \
                'VND', 100000, 0, 100000, 'Migration Customer', '0901234567', \
                'Migration Address', 'manual', CURRENT_TIMESTAMP(6), 'online'); \
             SET @order_id = LAST_INSERT_ID(); \
             INSERT INTO shipments \
               (public_id, shipment_code, order_id, failure_reason, failed_attempt_1_key, failed_attempt_2_key) \
             VALUES \
               (UUID_TO_BIN(UUID()), 'SHP-MIGRATION-CHECK', @order_id, 'customer_unavailable', \
                'migration-attempt-1', 'migration-attempt-2'); \
             INSERT INTO categories (public_id, code, name) \
             VALUES (UUID_TO_BIN(UUID()), 'MIGRATION-CAT', 'Migration Category'); \
             SET @category_id = LAST_INSERT_ID(); \
             INSERT INTO products (public_id, category_id, slug, name) \
             VALUES (UUID_TO_BIN(UUID()), @category_id, 'migration-product', 'Migration Product'); \
             SET @product_id = LAST_INSERT_ID(); \
             INSERT INTO product_variants \
               (public_id, product_id, sku, size_code, color_code, price_vnd) \
             VALUES \
               (UUID_TO_BIN(UUID()), @product_id, 'MIGRATION-SKU', 'M', 'BLACK', 100000);"
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini upgrade 0019
          docker compose exec -T mysql mysql -u ecommerce_app -ppassword ecommerce -Nse \
            "SELECT COUNT(*) FROM shipment_attempts WHERE idempotency_key LIKE 'migration-attempt-%'" \
            | grep -qx 2
          docker compose exec -T mysql mysql -u ecommerce_app -ppassword ecommerce -e \
            "INSERT INTO inventory_transactions \
               (public_id, variant_id, location_type, movement_type, quantity_delta, reference_code) \
             SELECT UUID_TO_BIN(UUID()), variant_id, 'central_warehouse', 'order_cancellation', 1, 'MIGRATION-CANCEL' \
             FROM product_variants WHERE sku = 'MIGRATION-SKU';"
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini downgrade 0018
          docker compose exec -T mysql mysql -u ecommerce_app -ppassword ecommerce -Nse \
            "SELECT CONCAT(failed_attempt_1_key, ':', failed_attempt_2_key) FROM shipments WHERE shipment_code = 'SHP-MIGRATION-CHECK'" \
            | grep -qx "migration-attempt-1:migration-attempt-2"
          docker compose exec -T mysql mysql -u ecommerce_app -ppassword ecommerce -Nse \
            "SELECT COUNT(*) FROM inventory_transactions WHERE reference_code = 'MIGRATION-CANCEL' AND movement_type = 'adjustment'" \
            | grep -qx 1
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini upgrade head
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini downgrade -1
          uv run --locked --package ecommerce-api alembic -c database/alembic.ini upgrade head

      - name: Start the operational web stack
        run: docker compose --profile core up -d --build --wait ecommerce-api storefront

      - name: Verify live HTTP, auth, OpenAPI, and analytics degradation contracts
        run: ./scripts/verify_core.sh

      - name: Teardown
        if: always()
        run: docker compose down -v

