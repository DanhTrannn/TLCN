name: CI

on:
  push:
    branches: [dev, main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  NODE_VERSION: "22.18.0"

jobs:
  repository-validation:
    name: Repository validation & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Validate Docker Compose (all active profiles)
        run: >-
          docker compose --env-file .env.example
          --profile core --profile batch --profile streaming --profile lakehouse-tools
          config --quiet

      - name: Verify Airflow DAG Python compilation
        run: python3 -m compileall -q airflow/dags/

      - name: Lint Python codebase with ruff
        run: uvx ruff check .

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_CSRF_COOKIE_NAME: web_csrf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint storefront
        run: npm run lint

      - name: Type-check storefront
        run: npm run typecheck

      - name: Build storefront
        run: npm run build

