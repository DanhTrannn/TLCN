name: Platform integration

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "20 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  batch-lakehouse:
    name: Batch MySQL to Iceberg Gold
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Create local integration environment
        run: cp .env.example .env

      - name: Install convergence probe dependency
        run: python3 -m pip install --user pyyaml==6.0.2

      - name: Start batch integration services
        run: >-
          docker compose --profile core --profile batch --profile lakehouse-tools
          up -d --build --wait
          mysql ecommerce-api minio minio-init postgres polaris-bootstrap polaris polaris-init
          trino spark-master spark-worker airflow-init airflow-webserver airflow-scheduler

      - name: Verify catalog and query interoperability
        run: ./scripts/lakehouse_smoke.sh

      - name: Verify RBAC boundaries (batch)
        run: ./scripts/verify_rbac_batch.sh

      - name: Verify full OLTP batch pipeline
        run: ./scripts/verify_batch_pipeline.sh

      - name: Collect service logs after failure
        if: failure()
        run: docker compose --profile core --profile batch logs --no-color --tail=300

      - name: Teardown
        if: always()
        run: docker compose --profile core --profile batch --profile lakehouse-tools down -v

  access-log-streaming:
    name: API access log to Iceberg Gold
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Create local integration environment
        run: cp .env.example .env

      - name: Start streaming integration services
        run: >-
          docker compose --profile core --profile streaming
          up -d --build --wait
          mysql ecommerce-api minio minio-init postgres polaris-bootstrap polaris polaris-init
          trino kafka flink-jobmanager flink-taskmanager flink-submit

      - name: Verify API to Kafka to Flink to Iceberg Gold
        run: ./scripts/verify_streaming.sh

      - name: Verify RBAC boundaries (streaming)
        run: ./scripts/verify_rbac_streaming.sh

      - name: Collect service logs after failure
        if: failure()
        run: docker compose --profile core --profile streaming logs --no-color --tail=300

      - name: Teardown
        if: always()
        run: docker compose --profile core --profile streaming down -v
