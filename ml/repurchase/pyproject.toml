[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlcn-repurchase-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "joblib==1.5.1",
  "pandas==2.3.1",
  "pyarrow==20.0.0",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.1"
]

[project.scripts]
tlcn-repurchase-ml = "repurchase_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

