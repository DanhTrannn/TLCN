[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tlcn-batch-pipeline"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "delta-spark==3.3.2",
  "minio==7.2.15",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyMySQL[rsa]==1.1.1",
  "pyspark==3.5.5",
  "PyYAML==6.0.2"
]

[project.scripts]
tlcn-pipeline = "tlcn_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

