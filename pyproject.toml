[project]
name = "lakehouse-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "services/ecommerce-api",
  "generator",
  "pipelines",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",     # Error rules
  "F",     # Pyflakes rules
  "W",     # Warning rules
]
ignore = [
  "E501",  # Line too long
  "E712",  # Comparison to True (SQLAlchemy boolean column expressions)
  "E402",  # Module level import not at top of file (sys.path injection)
]


